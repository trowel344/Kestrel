name: distribution

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  distribution:
    name: build and smoke-test distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build --sdist --wheel
      - name: Validate artifacts
        run: |
          python -m twine check dist/*
          python - <<'PY'
          from pathlib import Path

          artifacts = list(Path("dist").iterdir())
          assert any(path.suffix == ".whl" for path in artifacts), "no wheel in dist/"
          assert any(path.name.endswith(".tar.gz") for path in artifacts), "no sdist in dist/"
          assert all(path.stat().st_size > 0 for path in artifacts), "empty distribution artifact"
          PY
      - name: Install wheel in an isolated environment
        run: |
          venv="$RUNNER_TEMP/kestrel-wheel-smoke"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --upgrade pip
          # Install the wheel with its runtime dependencies. Optional
          # conversion dependencies are not pulled in by a bare install.
          "$venv/bin/python" -m pip install dist/*.whl
          "$venv/bin/python" -c "import importlib.metadata as metadata; import kestrel; assert metadata.version('kestrel') == kestrel.__version__"
          "$venv/bin/kestrel" --version
          "$venv/bin/kestrel" --help >/dev/null
      - name: Smoke-test machine-readable doctor output
        run: |
          venv="$RUNNER_TEMP/kestrel-wheel-smoke"
          set +e
          "$venv/bin/kestrel" doctor --json > "$RUNNER_TEMP/kestrel-doctor.json"
          status=$?
          set -e
          # A clean CI host has no llama.cpp binary, so doctor may report a
          # health failure. Its output and exit status must remain well-formed.
          test "$status" -eq 0 || test "$status" -eq 1
          "$venv/bin/python" -c "import json, pathlib; payload=json.loads(pathlib.Path('$RUNNER_TEMP/kestrel-doctor.json').read_text()); assert payload['status'] in {'ok', 'warn', 'fail'}; assert isinstance(payload['checks'], list)"
