name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,convert]" build twine
      - name: Run release verification
        run: |
          pytest --cov=kestrel --cov-report=term
          ruff check kestrel/ tests/
          ruff format --check kestrel/ tests/
      - name: Build sdist and wheel
        run: python -m build
      - name: Validate and smoke-test release artifacts
        run: |
          python -m twine check dist/*
          python -c "import glob; assert glob.glob('dist/*.whl'), 'no wheel in dist/'; assert glob.glob('dist/*.tar.gz'), 'no sdist in dist/'"
          venv="$RUNNER_TEMP/kestrel-release-smoke"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --upgrade pip
          "$venv/bin/python" -m pip install dist/*.whl
          "$venv/bin/python" -c "import importlib.metadata as metadata; import kestrel; assert metadata.version('kestrel') == kestrel.__version__"
          "$venv/bin/python" -c "import importlib.metadata as metadata, os; expected='v' + metadata.version('kestrel'); actual=os.environ['GITHUB_REF_NAME']; assert actual == expected, f'tag {actual} does not match package {expected}'"
          "$venv/bin/kestrel" --version
          "$venv/bin/kestrel" --help >/dev/null
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
