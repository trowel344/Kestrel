name: Bug report
description: Report a reproducible Kestrel problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Kestrel. Please remove model paths, tokens,
        or other private information before posting logs.
  - type: input
    id: version
    attributes:
      label: Kestrel version
      description: Output of `kestrel --version`.
      placeholder: "kestrel 1.6.0"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS, Python version, GPU, and RAM.
      placeholder: "Ubuntu 24.04, Python 3.12, RTX 4060 8 GB, 16 GB RAM"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Paste `kestrel doctor` output after removing private paths.
      render: text
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the exact command, actual result, and expected result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Model format, quantization, logs, screenshots, or related issues.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This report does not contain credentials or private model data.
          required: true
