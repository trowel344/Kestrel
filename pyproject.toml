[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "W", "I"]
ignore = [
  "E501",   # long lines are intentional in compact CLI/UI formatting
  "E402",   # module-level lazy imports are used to keep heavy deps import-free
  "W605",   # intentional backslash escapes in strings/UI frames
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning:torch.*",
]



[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kestrel"
version = "1.6.0"
description = "Hardware-aware local model orchestration, conversion, and management"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Kestrel maintainers", email = "trowel344@gmail.com" }]
keywords = [
    "llm",
    "llama.cpp",
    "gguf",
    "moe",
    "local-ai",
    "gpu",
    "quantization",
    "nvfp4",
]
dependencies = [
    # Python <=3.12 can use the last NumPy 1.x line, which keeps the ndarray
    # bridge compatible with the torch 2.1 converter floor. Python 3.13 needs
    # NumPy 2.1+ and therefore pairs with the newer torch floor below.
    "numpy>=1.26,<2; python_version < '3.13'",
    "numpy>=2.4.6,<3; python_version >= '3.13'",
    "gguf>=0.19",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/trowel344/Kestrel"
Issues = "https://github.com/trowel344/Kestrel/issues"
Changelog = "https://github.com/trowel344/Kestrel/blob/main/CHANGELOG.md"

[project.optional-dependencies]
convert = [
    "torch>=2.1; python_version < '3.13'",
    "torch>=2.13.0; python_version >= '3.13'",
    "safetensors",
]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff==0.16.*",
]

[project.scripts]
kestrel = "kestrel.cli:main"

[tool.setuptools.packages.find]
include = ["kestrel*"]

[tool.coverage.run]
source = ["kestrel"]
branch = true

[tool.coverage.report]
# Rising floor, not a target: the current branch-aware suite lands above 60%.
# Keep enough platform headroom without allowing a large silent regression.
fail_under = 55
