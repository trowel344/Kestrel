[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "W", "I"]
ignore = [
  "E501",   # long lines are intentional in compact CLI/UI formatting
  "E402",   # module-level lazy imports are used to keep heavy deps import-free
  "W605",   # intentional backslash escapes in strings/UI frames
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning:torch.*",
]



[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kestrel"
version = "1.5.0"
description = "Hardware-aware local model orchestration, conversion, and management"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Kestrel maintainers", email = "trowel344@gmail.com" }]
keywords = [
    "llm",
    "llama.cpp",
    "gguf",
    "moe",
    "local-ai",
    "gpu",
    "quantization",
    "nvfp4",
]
dependencies = [
    "numpy",
    "gguf>=0.19",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/trowel344/Kestrel"
Issues = "https://github.com/trowel344/Kestrel/issues"
Changelog = "https://github.com/trowel344/Kestrel/blob/main/CHANGELOG.md"

[project.optional-dependencies]
convert = [
    "torch>=2.0",
    "safetensors",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
kestrel = "kestrel.cli:main"

[tool.setuptools.packages.find]
include = ["kestrel*"]
